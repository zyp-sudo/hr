[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov=scripts.bilingual_matching --cov=scripts.job_taxonomy --cov=scripts.evaluate_accuracy --cov=scripts.job_field_extraction --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
