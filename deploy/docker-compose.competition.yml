# =============================================================================
# XH-202621 TalentMatch — Competition Deployment
#
# One-command startup:
#   docker compose -f deploy/docker-compose.competition.yml up -d
#
# Services: MySQL, Neo4j, Elasticsearch, Milvus (etcd+minio),
#           FastAPI (8080), Java (8081), Web (3000)
# =============================================================================
name: xh202621-competition

services:
  # ===========================================================================
  # Infrastructure — same as root docker-compose.yml, never modified
  # ===========================================================================

  mysql:
    image: mysql:8.4
    container_name: ${MYSQL_CONTAINER_NAME:-xh-comp-mysql}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-job_kg}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - comp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:5.26-community
    container_name: ${NEO4J_CONTAINER_NAME:-xh-comp-neo4j}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - comp_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1' | cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-password123} >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: ${ES_CONTAINER_NAME:-xh-comp-elasticsearch}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - comp_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: ${MILVUS_ETCD_CONTAINER_NAME:-xh-comp-milvus-etcd}
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - comp_milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 30

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ${MILVUS_MINIO_CONTAINER_NAME:-xh-comp-milvus-minio}
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data
    volumes:
      - comp_milvus_minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  milvus:
    image: milvusdb/milvus:v2.6.19
    container_name: ${MILVUS_CONTAINER_NAME:-xh-comp-milvus}
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_WEBUI_PORT:-9091}:9091"
    volumes:
      - comp_milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ===========================================================================
  # Application services — built from source
  # ===========================================================================

  python:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    image: xh202621/storage-api:competition
    container_name: xh-comp-storage-api
    restart: unless-stopped
    environment:
      # MySQL
      MYSQL_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-job_kg}?charset=utf8mb4
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      # Elasticsearch
      ES_HOST: http://elasticsearch:9200
      # Milvus
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      # Java proxy
      JAVA_BACKEND_URL: http://java:8081
    ports:
      - "${STORAGE_API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  java:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.java
    image: xh202621/java-backend:competition
    container_name: xh-comp-java-backend
    restart: unless-stopped
    environment:
      BACKEND_PORT: "8081"
    ports:
      - "${JAVA_API_PORT:-8081}:8081"
    # CSV data mounted read-only — data is included in image as fallback,
    # but bind-mount supplies live files for the competition demo.
    volumes:
      - ../data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ../talentmatch
      dockerfile: ../deploy/Dockerfile.web
    image: xh202621/web-frontend:competition
    container_name: xh-comp-web-frontend
    restart: unless-stopped
    environment:
      PORT: "3000"
      STORAGE_API_URL: http://python:8080
      JAVA_API_URL: http://java:8081
      # AI / LLM keys — supplied via env_file or host env, NEVER baked in
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-google}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_BASE_URL: ${AI_BASE_URL:-}
      APP_URL: http://localhost:3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      python:
        condition: service_healthy
      java:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

# =============================================================================
# Named volumes — persist across restarts; docker compose down will NOT remove them
# =============================================================================
volumes:
  comp_mysql_data:
  comp_neo4j_data:
  comp_elasticsearch_data:
  comp_milvus_etcd_data:
  comp_milvus_minio_data:
  comp_milvus_data:
