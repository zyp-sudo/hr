name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: python scripts/evaluate_accuracy.py --output /tmp/accuracy_report.json
      - run: python scripts/evaluate_holdout.py --output /tmp/accuracy_holdout_report.json --min-skill-f1 0.6 --min-category-accuracy 0.6

  windows-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate PowerShell startup scripts
        shell: powershell
        run: |
          $files = @(
            "start.ps1",
            "scripts/start-backend.ps1",
            "scripts/start-frontend.ps1",
            "scripts/init-storage.ps1",
            "scripts/verify-cleanroom.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$file contains PowerShell syntax errors: $($errors.Message -join '; ')"
            }
          }
      - name: Compile Java backend to runner temp
        shell: powershell
        run: |
          $runtimeOut = Join-Path $env:RUNNER_TEMP "xh-java-runtime"
          New-Item -ItemType Directory -Force -Path $runtimeOut | Out-Null
          javac -encoding UTF-8 -d $runtimeOut backend/src/com/xh202621/*.java
          if ($LASTEXITCODE -ne 0) {
            throw "Java compilation failed with exit code $LASTEXITCODE"
          }
