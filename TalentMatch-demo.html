<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人岗匹配智能评估系统 — TalentMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--panel:rgba(255,255,255,0.025);--border:rgba(255,255,255,0.06);
  --text:#e8e8ed;--text-dim:#9090a8;--text-muted:#606078;
  --violet:#a78bfa;--lilac:#c084fc;--mint:#5eead4;--cyan:#22d3ee;
  --purple:#8b5cf6;--rose:#f472b6;--amber:#fbbf24;--emerald:#34d399;
  --red:#f87171;--blue:#60a5fa;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Noto Sans SC',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:var(--font-body);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
}
/* ===== AMBIENT LIGHT SYSTEM ===== */
.ambient{
  position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
}
.light{
  position:absolute;border-radius:50%;filter:blur(120px);opacity:0.18;
  animation:bokeh 18s ease-in-out infinite;
}
.light-1{width:600px;height:600px;background:radial-gradient(circle,rgba(167,139,250,0.5),transparent);top:-10%;left:-5%;animation-delay:0s}
.light-2{width:500px;height:500px;background:radial-gradient(circle,rgba(34,211,238,0.4),transparent);top:60%;right:-8%;animation-delay:-6s}
.light-3{width:450px;height:450px;background:radial-gradient(circle,rgba(192,132,252,0.4),transparent);bottom:-10%;left:30%;animation-delay:-12s}
.light-4{width:550px;height:550px;background:radial-gradient(circle,rgba(244,114,182,0.35),transparent);top:20%;left:60%;animation-delay:-4s}
.light-5{width:400px;height:400px;background:radial-gradient(circle,rgba(94,234,212,0.35),transparent);top:40%;left:-6%;animation-delay:-10s}
@keyframes bokeh{
  0%,100%{transform:translate(0,0) scale(1);opacity:0.16}
  25%{transform:translate(60px,-40px) scale(1.1);opacity:0.22}
  50%{transform:translate(-30px,50px) scale(0.9);opacity:0.14}
  75%{transform:translate(40px,20px) scale(1.05);opacity:0.2}
}

/* ===== MOUSE GLOW ===== */
.mouse-glow{
  position:fixed;width:400px;height:400px;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(167,139,250,0.12),transparent 70%);
  border-radius:50%;transform:translate(-50%,-50%);transition:left 0.4s ease-out,top 0.4s ease-out;
}

/* ===== APP SHELL ===== */
.app-shell{
  position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 24px;
}

/* ===== GLASS HEADER ===== */
.header{
  position:sticky;top:12px;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;margin-top:12px;
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:20px;
}
.brand{
  display:flex;align-items:center;gap:12px;
}
.brand-logo{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--violet),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:18px;color:#fff;
}
.brand-text{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:-0.2px}
.header-actions{display:flex;align-items:center;gap:16px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--emerald);box-shadow:0 0 8px var(--emerald)}
.status-text{font-size:12px;color:var(--text-dim);font-family:var(--font-mono)}
.avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--violet),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;cursor:pointer;transition:transform .2s;
}
.avatar:hover{transform:scale(1.08)}
.notif-btn{
  position:relative;width:34px;height:34px;border-radius:10px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;
  transition:all .2s;
}
.notif-btn:hover{background:rgba(255,255,255,0.08)}
.notif-badge{
  position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;
  background:var(--rose);
}

/* ===== NAVIGATION ===== */
.nav-bar{
  position:sticky;top:90px;z-index:40;
  display:flex;gap:6px;padding:6px;margin-top:16px;
  background:rgba(255,255,255,0.02);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.05);border-radius:16px;
  overflow-x:auto;
}
.nav-btn{
  flex-shrink:0;padding:10px 20px;border-radius:12px;border:none;
  background:transparent;color:var(--text-dim);
  font-family:var(--font-body);font-size:14px;cursor:pointer;
  transition:all .25s;white-space:nowrap;
}
.nav-btn:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.nav-btn.active{
  color:#fff;background:rgba(167,139,250,0.15);
  box-shadow:0 0 20px rgba(167,139,250,0.08);
}

/* ===== PAGE CONTENT ===== */
.page-content{margin-top:24px;padding-bottom:80px;min-height:60vh}

/* ===== STAT CARDS ===== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{
  padding:22px 24px;border-radius:18px;
  background:var(--panel);border:1px solid var(--border);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:all .3s;cursor:pointer;
}
.stat-card:hover{transform:translateY(-2px);border-color:rgba(167,139,250,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.stat-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.stat-value{font-family:var(--font-display);font-size:32px;font-weight:700;background:linear-gradient(135deg,var(--violet),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-change{font-size:12px;margin-top:6px}
.stat-change.up{color:var(--emerald)}
.stat-icon{font-size:24px;margin-bottom:8px}

/* ===== SECTION ===== */
.section-title{
  font-family:var(--font-display);font-size:18px;font-weight:600;
  margin-bottom:16px;display:flex;align-items:center;gap:10px;
}
.section-title::before{content:'';width:4px;height:20px;background:linear-gradient(to bottom,var(--violet),var(--cyan));border-radius:2px}

/* ===== JOB CARDS ===== */
.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.job-card{
  padding:20px 22px;border-radius:16px;
  background:var(--panel);border:1px solid var(--border);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:all .3s;cursor:pointer;
}
.job-card:hover{border-color:rgba(167,139,250,0.2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.job-card h3{font-family:var(--font-display);font-size:16px;font-weight:600;margin-bottom:6px}
.job-card .dept{font-size:12px;color:var(--text-dim);margin-bottom:10px}
.job-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.job-tag{
  padding:4px 10px;border-radius:20px;font-size:11px;
  background:rgba(167,139,250,0.1);color:var(--violet);
  border:1px solid rgba(167,139,250,0.15);
}
.job-meta{display:flex;justify-content:space-between;align-items:center}
.job-meta span{font-size:12px;color:var(--text-muted);font-family:var(--font-mono)}
.job-status{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500}
.job-status.hot{background:rgba(244,114,182,0.12);color:var(--rose)}
.job-status.active{background:rgba(94,234,212,0.12);color:var(--mint)}

/* ===== MATCHING WORKSPACE (3-COLUMN) ===== */
.match-layout{display:grid;grid-template-columns:280px 1fr 360px;gap:16px;min-height:600px}
.match-sidebar{
  padding:18px;border-radius:18px;background:var(--panel);
  border:1px solid var(--border);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;gap:14px;
}
.match-sidebar h4{font-family:var(--font-display);font-size:14px;font-weight:600}
.sidebar-select{
  width:100%;padding:10px 12px;border-radius:10px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);
  color:var(--text);font-family:var(--font-body);font-size:13px;
  cursor:pointer;outline:none;
}
.sidebar-select:focus{border-color:var(--violet)}
.candidate-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1}
.candidate-thumb{
  padding:12px;border-radius:12px;background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.04);cursor:pointer;
  transition:all .2s;font-size:13px;
}
.candidate-thumb:hover{border-color:rgba(167,139,250,0.2);background:rgba(255,255,255,0.04)}
.candidate-thumb .name{font-weight:600;font-size:14px}
.candidate-thumb .skills{font-size:11px;color:var(--text-dim);margin-top:4px}
.match-btn{
  width:100%;padding:12px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--violet),var(--purple));
  color:#fff;font-family:var(--font-body);font-size:14px;font-weight:600;
  cursor:pointer;transition:all .3s;
}
.match-btn:hover{opacity:0.9;box-shadow:0 4px 20px rgba(167,139,250,0.3)}

.match-workspace{
  border-radius:18px;background:var(--panel);border:1px solid var(--border);
  backdrop-filter:blur(10px);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.workspace-empty{text-align:center;color:var(--text-muted)}
.workspace-empty .icon{font-size:48px;margin-bottom:12px;opacity:0.3}
.workspace-empty p{font-size:14px}
.candidate-on-canvas{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:220px;padding:18px;border-radius:16px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(167,139,250,0.2);
  backdrop-filter:blur(12px);cursor:grab;transition:box-shadow .3s;
}
.candidate-on-canvas:hover{box-shadow:0 0 30px rgba(167,139,250,0.15)}
.candidate-on-canvas .name{font-weight:600;font-size:15px}
.candidate-on-canvas .info{font-size:11px;color:var(--text-dim);margin-top:6px}

.match-result-panel{
  padding:18px;border-radius:18px;background:var(--panel);
  border:1px solid var(--border);backdrop-filter:blur(10px);
}
.result-empty{text-align:center;color:var(--text-muted);padding:40px 0;font-size:14px}
.score-ring{
  width:80px;height:80px;border-radius:50%;margin:0 auto 12px;
  background:conic-gradient(var(--emerald) 0% 85%,rgba(255,255,255,0.05) 85% 100%);
  display:flex;align-items:center;justify-content:center;
}
.score-inner{
  width:62px;height:62px;border-radius:50%;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--emerald);
}
.match-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.metric-item{padding:10px;border-radius:10px;background:rgba(255,255,255,0.02);text-align:center}
.metric-value{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--cyan)}
.metric-label{font-size:10px;color:var(--text-dim);margin-top:2px}

/* ===== CAPABILITY GRAPH PAGE ===== */
.graph-container{
  border-radius:18px;background:var(--panel);border:1px solid var(--border);
  backdrop-filter:blur(10px);padding:24px;min-height:500px;
  position:relative;overflow:hidden;
}
.graph-node{
  position:absolute;padding:10px 16px;border-radius:12px;
  font-size:12px;font-weight:500;cursor:pointer;transition:all .3s;
}
.graph-node.role{background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.3);color:var(--violet)}
.graph-node.skill{background:rgba(34,211,238,0.12);border:1px solid rgba(34,211,238,0.25);color:var(--cyan)}
.graph-node.gap{background:rgba(244,114,182,0.12);border:1px solid rgba(244,114,182,0.25);color:var(--rose)}
.graph-canvas-svg{position:absolute;inset:0;pointer-events:none}
.graph-canvas-svg line{stroke:rgba(255,255,255,0.06);stroke-width:1}

/* ===== ASSESSMENT / UNIFIED TABLE ===== */
.table-wrap{border-radius:18px;background:var(--panel);border:1px solid var(--border);overflow:hidden}
.table-header{
  display:grid;grid-template-columns:2fr 1fr 1fr 120px 100px;gap:12px;
  padding:14px 20px;background:rgba(255,255,255,0.02);font-size:12px;
  color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px;
}
.table-row{
  display:grid;grid-template-columns:2fr 1fr 1fr 120px 100px;gap:12px;
  padding:14px 20px;border-top:1px solid rgba(255,255,255,0.03);font-size:13px;
  transition:background .2s;cursor:pointer;align-items:center;
}
.table-row:hover{background:rgba(255,255,255,0.02)}
.badge{
  display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;
}
.badge.excellent{background:rgba(94,234,212,0.12);color:var(--mint)}
.badge.review{background:rgba(251,191,36,0.12);color:var(--amber)}
.badge.average{background:rgba(96,165,250,0.12);color:var(--blue)}

/* ===== TREND PAGE ===== */
.trend-tabs{display:flex;gap:8px;margin-bottom:20px}
.trend-tab{
  padding:10px 20px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);
  background:transparent;color:var(--text-dim);font-family:var(--font-body);
  font-size:13px;cursor:pointer;transition:all .2s;
}
.trend-tab.active{background:rgba(167,139,250,0.12);border-color:rgba(167,139,250,0.3);color:var(--violet)}
.chart-placeholder{
  height:300px;border-radius:18px;background:var(--panel);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text-muted);
  font-size:14px;
}

/* ===== FAVORITES PAGE ===== */
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.fav-card{
  padding:20px;border-radius:16px;background:var(--panel);border:1px solid var(--border);
  backdrop-filter:blur(10px);transition:all .3s;cursor:pointer;
}
.fav-card:hover{border-color:rgba(251,191,36,0.3);transform:translateY(-2px)}
.fav-card .name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.fav-card .star{color:var(--amber)}
.fav-card .meta{font-size:12px;color:var(--text-dim);margin-top:8px}
.fav-card .score{font-family:var(--font-mono);font-size:20px;font-weight:600;color:var(--emerald);margin-top:8px}

/* ===== FAB ===== */
.fab{
  position:fixed;bottom:32px;right:32px;z-index:100;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--violet),var(--cyan));
  border:none;color:#fff;font-size:28px;cursor:pointer;
  box-shadow:0 8px 32px rgba(167,139,250,0.3);
  transition:all .3s;display:flex;align-items:center;justify-content:center;
}
.fab:hover{transform:scale(1.08);box-shadow:0 12px 40px rgba(167,139,250,0.4)}

/* ===== RESPONSIVE ===== */
@media(max-width:1024px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .match-layout{grid-template-columns:1fr}
}
@media(max-width:640px){
  .stat-grid{grid-template-columns:1fr}
  .nav-bar{flex-wrap:nowrap}
}
</style>
</head>
<body>

<!-- Ambient Light -->
<div class="ambient">
  <div class="light light-1"></div>
  <div class="light light-2"></div>
  <div class="light light-3"></div>
  <div class="light light-4"></div>
  <div class="light light-5"></div>
</div>
<div class="mouse-glow" id="mouseGlow"></div>

<!-- App Shell -->
<div class="app-shell">

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="brand-logo">TM</div>
      <span class="brand-text">人岗匹配智能评估系统</span>
    </div>
    <div class="header-actions">
      <span class="status-dot"></span>
      <span class="status-text">AI 已就绪 · Gemini 2.5</span>
      <button class="notif-btn" title="通知">
        🔔<span class="notif-badge"></span>
      </button>
      <div class="avatar">管</div>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="nav-bar" id="navBar">
    <button class="nav-btn active" data-page="overview">🏠 主页</button>
    <button class="nav-btn" data-page="jobs">💼 岗位管理</button>
    <button class="nav-btn" data-page="matching">🎯 人岗匹配</button>
    <button class="nav-btn" data-page="capability">📊 岗位能力图谱</button>
    <button class="nav-btn" data-page="unified">📋 评估结果</button>
    <button class="nav-btn" data-page="favorites">⭐ 特别关注</button>
    <button class="nav-btn" data-page="evolution">📈 招聘趋势</button>
  </nav>

  <!-- Page Content -->
  <div class="page-content" id="pageContent"></div>

</div>

<!-- FAB -->
<button class="fab" title="上传简历">+</button>

<script>
// ===== NAVIGATION =====
const pages = { overview, jobs, matching, capability, unified, favorites, evolution };

document.getElementById('navBar').addEventListener('click', (e) => {
  const btn = e.target.closest('.nav-btn');
  if (!btn) return;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPage(btn.dataset.page);
});

// ===== MOUSE GLOW =====
document.addEventListener('mousemove', (e) => {
  const glow = document.getElementById('mouseGlow');
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';
});

// ===== TAB SWITCHERS (generic delegation) =====
document.getElementById('pageContent').addEventListener('click', (e) => {
  const tab = e.target.closest('.trend-tab');
  if (tab) {
    const parent = tab.parentElement;
    parent.querySelectorAll('.trend-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  }
});

// ===== INITIAL RENDER =====
renderPage('overview');

function renderPage(key) {
  const fn = pages[key];
  document.getElementById('pageContent').innerHTML = fn ? fn() : '<p style="color:var(--text-dim)">页面开发中...</p>';
}

function renderJobCard(title, dept, tags, salary, status, candidates) {
  const cls = status === 'hot' ? 'hot' : 'active';
  const label = status === 'hot' ? '🔥 急招' : '🟢 招聘中';
  return `
    <div class="job-card">
      <h3>${title}</h3>
      <div class="dept">${dept}</div>
      <div class="job-tags">${tags.map(t => `<span class="job-tag">${t}</span>`).join('')}</div>
      <div class="job-meta">
        <span>${salary}</span>
        <span>${candidates}</span>
        <span class="job-status ${cls}">${label}</span>
      </div>
    </div>
  `;
}

// ===== PAGE: OVERVIEW (主页) =====
function overview() {
  return `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-icon">💼</div>
        <div class="stat-label">在招岗位</div>
        <div class="stat-value">24</div>
        <div class="stat-change up">↑ 3 本周新增</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-label">候选人才</div>
        <div class="stat-value">186</div>
        <div class="stat-change up">↑ 12 本周新增</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-label">成功匹配</div>
        <div class="stat-value">47</div>
        <div class="stat-change up">↑ 8 本月</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📊</div>
        <div class="stat-label">AI 评估次数</div>
        <div class="stat-value">1,204</div>
        <div class="stat-change up">↑ 156 本周</div>
      </div>
    </div>

    <div class="section-title">优先岗位</div>
    <div class="job-grid">
