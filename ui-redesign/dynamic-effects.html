<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>未来科技感 — 动态特效展示</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  /* ============================================================
     RESET & BASE
     ============================================================ */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    background: #060713;
    color: #e4e1e8;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================================================
     LAYER 1 — CONTAINER & GRID BACKGROUND
     ============================================================ */
  .container {
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 80% 20%, #1a103c 0%, #060713 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* 纵向网格线 (vertical grid lines) */
  .container::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0.05) 1px,
      transparent 1px
    );
    background-size: 50px 100%;
    pointer-events: none;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.1) 80%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.1) 80%);
    z-index: 1;
  }

  /* 横向网格线 (horizontal grid lines) — 补齐棋盘格效果 */
  .container::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(
      0deg,
      rgba(255, 255, 255, 0.03) 1px,
      transparent 1px
    );
    background-size: 100% 50px;
    pointer-events: none;
    mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0.1) 80%);
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0.1) 80%);
    z-index: 1;
  }

  /* 点缀 — 随机散布的微光星点 */
  .star-dust {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 25%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 72% 18%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 88% 55%, rgba(175,64,255,0.5), transparent),
      radial-gradient(1px 1px at 35% 70%, rgba(0,221,235,0.5), transparent),
      radial-gradient(1px 1px at 55% 40%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 92% 72%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 8% 82%, rgba(175,64,255,0.4), transparent),
      radial-gradient(1px 1px at 45% 12%, rgba(0,221,235,0.4), transparent),
      radial-gradient(1.5px 1.5px at 62% 85%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 28% 52%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 78% 35%, rgba(175,64,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 50% 92%, rgba(0,221,235,0.4), transparent);
    background-size: 300px 300px;
    animation: starTwinkle 4s ease-in-out infinite alternate;
  }

  @keyframes starTwinkle {
    0%   { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* ============================================================
     LAYER 2 — PURPLE-CYAN LIGHT SOURCE (MIDDLE-RIGHT)
     ============================================================ */
  .light-source {
    position: absolute;
    top: 40%;
    left: 65%;
    transform: translate(-50%, -50%);
    width: 450px;
    height: 450px;
    background: radial-gradient(
      circle,
      rgba(0, 221, 235, 0.6) 0%,
      rgba(91, 66, 243, 0.6) 50%,
      transparent 70%
    );
    filter: blur(60px);
    z-index: 2;
    pointer-events: none;
    animation: lightPulse 5s ease-in-out infinite alternate;
  }

  @keyframes lightPulse {
    0% {
      opacity: 0.7;
      transform: translate(-50%, -50%) scale(1);
    }
    50% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.15);
    }
    100% {
      opacity: 0.7;
      transform: translate(-50%, -50%) scale(1);
    }
  }

  /* 辅助光源 — 左上角微弱的紫色补光，增加层次 */
  .light-source--secondary {
    position: absolute;
    top: 65%;
    left: 30%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 300px;
    background: radial-gradient(
      circle,
      rgba(175, 64, 255, 0.25) 0%,
      rgba(91, 66, 243, 0.15) 50%,
      transparent 70%
    );
    filter: blur(80px);
    z-index: 2;
    pointer-events: none;
    animation: lightPulseSecondary 7s ease-in-out infinite alternate;
  }

  @keyframes lightPulseSecondary {
    0%   { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); }
    100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); }
  }

  /* ============================================================
     LAYER 3 — FLOATING GLASSMORPHISM PANEL
     ============================================================ */
  .glass-card {
    width: 680px;
    min-height: 420px;
    padding: 36px 40px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
      0 20px 40px rgba(0, 0, 0, 0.4),
      inset 0 1px 1px rgba(255, 255, 255, 0.2),
      0 0 30px rgba(0, 221, 235, 0.1);
    z-index: 3;
    position: relative;
    display: flex;
    gap: 36px;
    align-items: center;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-12px); }
  }

  /* 面板顶部高光线 */
  .glass-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 20px;
    right: 20px;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.3),
      transparent
    );
    pointer-events: none;
  }

  /* ============================================================
     LEFT COLUMN — TECH TYPOGRAPHY
     ============================================================ */
  .glass-card__left {
    flex: 1 1 55%;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #00DDEB;
    padding: 6px 14px;
    border: 1px solid rgba(0, 221, 235, 0.3);
    border-radius: 999px;
    background: rgba(0, 221, 235, 0.06);
    width: fit-content;
  }

  .tag .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00DDEB;
    box-shadow: 0 0 8px #00DDEB;
    animation: dotBlink 2s ease-in-out infinite;
  }

  @keyframes dotBlink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  .title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    background: linear-gradient(135deg, #e4e1e8 0%, #cabeff 50%, #9bf2e9 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .divider {
    width: 60px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #AF40FF, #5B42F3, #00DDEB);
    animation: dividerShimmer 3s ease-in-out infinite;
    background-size: 200% 100%;
  }

  @keyframes dividerShimmer {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .subtitle {
    font-size: 15px;
    line-height: 1.6;
    color: rgba(228, 225, 232, 0.7);
    font-weight: 400;
  }

  .stats-row {
    display: flex;
    gap: 28px;
    margin-top: 4px;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #AF40FF, #00DDEB);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-label {
    font-size: 12px;
    color: rgba(228, 225, 232, 0.5);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ============================================================
     RIGHT COLUMN — NEON GLOWING CARD (190×254px)
     ============================================================ */
  .glass-card__right {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 190px;
    height: 254px;
    border-radius: 20px;
    padding: 5px;
    background-image: linear-gradient(144deg, #AF40FF, #5B42F3 50%, #00DDEB);
    position: relative;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* 外发光光晕 */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(144deg, #AF40FF, #5B42F3 50%, #00DDEB);
    filter: blur(25px);
    opacity: 0.5;
    z-index: -1;
    border-radius: 20px;
    transition: opacity 0.3s ease, filter 0.3s ease;
  }

  /* 第二层外光晕 — 更柔和的范围光 */
  .card::after {
    content: "";
    position: absolute;
    inset: -8px;
    background-image: linear-gradient(144deg, #AF40FF, #5B42F3 50%, #00DDEB);
    filter: blur(40px);
    opacity: 0.2;
    z-index: -2;
    border-radius: 24px;
    transition: opacity 0.3s ease;
  }

  .card:hover {
    transform: translateY(-5px) scale(1.03);
  }

  .card:hover::before {
    opacity: 0.9;
    filter: blur(35px);
  }

  .card:hover::after {
    opacity: 0.4;
  }

  /* 卡片内部深色内容区 */
  .card__content {
    background: rgb(5, 6, 45);
    border-radius: 17px;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    color: #fff;
    position: relative;
    overflow: hidden;
  }

  /* 内容区微光反射 */
  .card__content::before {
    content: "";
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    height: 40%;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.06) 0%,
      transparent 100%
    );
    border-radius: 14px;
    pointer-events: none;
  }

  .card__icon {
    font-size: 44px;
    filter: drop-shadow(0 0 12px rgba(0, 221, 235, 0.5));
    animation: iconFloat 3s ease-in-out infinite;
  }

  @keyframes iconFloat {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-6px); }
  }

  .card__title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 600;
    background: linear-gradient(135deg, #cabeff, #00DDEB);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    z-index: 1;
  }

  .card__code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.06em;
    z-index: 1;
  }

  /* ============================================================
     FLOATING ORB DECORATIONS (ambient particles around glass-card)
     ============================================================ */
  .orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
  }

  .orb--1 {
    width: 12px;
    height: 12px;
    top: -30px;
    right: 80px;
    background: rgba(0, 221, 235, 0.6);
    box-shadow: 0 0 20px rgba(0, 221, 235, 0.5);
    animation: orbDrift1 4s ease-in-out infinite;
  }

  .orb--2 {
    width: 8px;
    height: 8px;
    bottom: -16px;
    left: 100px;
    background: rgba(175, 64, 255, 0.6);
    box-shadow: 0 0 14px rgba(175, 64, 255, 0.5);
    animation: orbDrift2 5s ease-in-out infinite;
  }

  .orb--3 {
    width: 6px;
    height: 6px;
    top: 50%;
    right: -12px;
    background: rgba(91, 66, 243, 0.5);
    box-shadow: 0 0 10px rgba(91, 66, 243, 0.4);
    animation: orbDrift3 3.5s ease-in-out infinite;
  }

  @keyframes orbDrift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(8px, -10px) scale(1.4); }
  }

  @keyframes orbDrift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-6px, 8px) scale(1.3); }
  }

  @keyframes orbDrift3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-10px, -6px) scale(1.5); }
  }

  /* ============================================================
     MOUSE-FOLLOW GLOW (interactive)
     ============================================================ */
  .mouse-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    background: radial-gradient(
      circle 400px at var(--mx, 50%) var(--my, 50%),
      rgba(124, 92, 255, 0.06),
      transparent 80%
    );
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 768px) {
    .glass-card {
      width: 92vw;
      flex-direction: column;
      padding: 28px 24px;
      gap: 24px;
      min-height: auto;
    }

    .glass-card__left {
      align-items: center;
      text-align: center;
    }

    .title {
      font-size: 26px;
    }

    .stats-row {
      justify-content: center;
    }

    .glass-card__right {
      order: -1;
    }

    .card {
      width: 150px;
      height: 200px;
    }
  }
</style>
</head>
<body>

<!-- ============================================================
     LAYER 1 — CONTAINER + GRID + STARS
     ============================================================ -->
<div class="container">
  <div class="star-dust"></div>

  <!-- ============================================================
       LAYER 2 — LIGHT SOURCES
       ============================================================ -->
  <div class="light-source"></div>
  <div class="light-source--secondary"></div>

  <!-- ============================================================
       LAYER 3 — FLOATING GLASSMORPHISM PANEL
       ============================================================ -->
  <div class="glass-card">
    <!-- Ambient orbs -->
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>

    <!-- Left: Typography -->
    <div class="glass-card__left">
      <div class="tag">
        <span class="dot"></span>
        AI-Powered
      </div>

      <h2 class="title">人岗匹配<br/>智能评估系统</h2>

      <div class="divider"></div>

      <p class="subtitle">
        基于深度语义理解与多维特征对齐，精准量化候选人
        与目标岗位的匹配度，让每一次招聘决策都有数据支撑。
      </p>

      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-value">99.7%</span>
          <span class="stat-label">语义精度</span>
        </div>
        <div class="stat-item">
          <span class="stat-value">&lt;2s</span>
          <span class="stat-label">响应时间</span>
        </div>
        <div class="stat-item">
          <span class="stat-value">50K+</span>
          <span class="stat-label">岗位覆盖</span>
        </div>
      </div>
    </div>

    <!-- Right: Neon Glowing Card -->
    <div class="glass-card__right">
      <div class="card">
        <div class="card__content">
          <div class="card__icon">⚡</div>
          <span class="card__title">Deep Match</span>
          <span class="card__code">v3.2.0</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     MOUSE-FOLLOW GLOW LAYER
     ============================================================ -->
<div class="mouse-glow"></div>

<script>
  // Mouse-follow interactive glow
  const mouseGlow = document.querySelector('.mouse-glow');
  document.addEventListener('mousemove', (e) => {
    mouseGlow.style.setProperty('--mx', e.clientX + 'px');
    mouseGlow.style.setProperty('--my', e.clientY + 'px');
  });

  // Parallax-like subtle shift on the glass-card based on mouse position
  const glassCard = document.querySelector('.glass-card');
  document.addEventListener('mousemove', (e) => {
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;
    const deltaX = (e.clientX - centerX) / centerX;
    const deltaY = (e.clientY - centerY) / centerY;

    // Subtle 3D tilt-ish transform layered on top of float animation
    // We use a CSS custom property and combine in JS via direct style
    const tiltX = (deltaY * -2).toFixed(1);
    const tiltY = (deltaX * 2).toFixed(1);

    // Apply as an additive transform — note: this will override the float
    // animation, so we use a wrapper approach instead
  });

  // Enhanced: apply parallax to orbs instead (doesn't conflict with float animation)
  document.addEventListener('mousemove', (e) => {
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;
    const deltaX = (e.clientX - centerX) / centerX;
    const deltaY = (e.clientY - centerY) / centerY;

    const orbs = document.querySelectorAll('.orb');
    if (orbs[0]) orbs[0].style.transform = `translate(${deltaX * 12}px, ${deltaY * 12}px)`;
    if (orbs[1]) orbs[1].style.transform = `translate(${deltaX * -8}px, ${deltaY * -8}px)`;
    if (orbs[2]) orbs[2].style.transform = `translate(${deltaX * -14}px, ${deltaY * 6}px)`;

    // Subtle card content parallax (child level, doesn't break float)
    const cardContent = document.querySelector('.card__content');
    if (cardContent) {
      cardContent.style.transform = `translate(${deltaX * 3}px, ${deltaY * 3}px)`;
    }
  });
</script>

</body>
</html>
