{% extends "admin/base.html" %}
{% block content %}

<!-- Quality summary -->
<div class="stat-grid" id="dq-summary-cards">
  <div class="stat-card"><div class="stat-label">总记录数</div><div class="stat-value skeleton" style="width:80px;height:32px;">&nbsp;</div></div>
  <div class="stat-card"><div class="stat-label">平均质量分</div><div class="stat-value skeleton" style="width:60px;height:32px;">&nbsp;</div></div>
  <div class="stat-card"><div class="stat-label">A 级占比</div><div class="stat-value skeleton" style="width:60px;height:32px;">&nbsp;</div></div>
  <div class="stat-card"><div class="stat-label">数据源数</div><div class="stat-value skeleton" style="width:40px;height:32px;">&nbsp;</div></div>
</div>

<!-- Source quality table -->
<div class="card">
  <div class="card-header"><h3>数据源质量报告</h3></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>数据源</th><th>类型</th><th>记录数</th><th>平均分</th>
          <th>A 级</th><th>B 级</th><th>C 级</th><th>D 级</th>
          <th>质量分布</th>
        </tr>
      </thead>
      <tbody id="dq-source-body"><tr><td colspan="9" class="empty-state"><p>加载中…</p></td></tr></tbody>
    </table>
  </div>
</div>

<!-- Scoring rules + field coverage -->
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
  <!-- Rules -->
  <div class="card">
    <div class="card-header"><h3>评分规则</h3></div>
    <div id="dq-rules">加载中…</div>
  </div>
  <!-- Field coverage -->
  <div class="card">
    <div class="card-header"><h3>字段覆盖率</h3></div>
    <div id="dq-coverage">加载中…</div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
(async function() {
  const { API } = window.Admin;

  // --- Summary ------------------------------------------------------------
  try {
    const dq = await API.get('/data-quality/summary');
    document.getElementById('dq-summary-cards').innerHTML = `
      <div class="stat-card"><div class="stat-label">总记录数</div><div class="stat-value">${dq.total_records.toLocaleString()}</div><div class="stat-sub">统一岗位数据</div></div>
      <div class="stat-card"><div class="stat-label">平均质量分</div><div class="stat-value">${dq.avg_quality_score}</div><div class="stat-sub">满分 100</div></div>
      <div class="stat-card"><div class="stat-label">A 级占比</div><div class="stat-value">${dq.level_a_pct}%</div><div class="stat-sub">${dq.level_a.toLocaleString()} 条记录</div></div>
      <div class="stat-card"><div class="stat-label">数据源数</div><div class="stat-value">${dq.total_sources}</div><div class="stat-sub">活跃数据源</div></div>`;
  } catch(e) { console.error(e); }

  // --- Per-source table ---------------------------------------------------
  try {
    const report = await API.get('/data-quality/report');
    const tbody = document.getElementById('dq-source-body');
    if (!report.sources || report.sources.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="empty-state"><p>暂无质量报告数据</p></td></tr>';
    } else {
      tbody.innerHTML = report.sources.map(r => {
        const total = r.records || 0;
        const pctA = total ? (r.level_a/total*100) : 0;
        const pctB = total ? (r.level_b/total*100) : 0;
        const pctC = total ? (r.level_c/total*100) : 0;
        const pctD = total ? (r.level_d/total*100) : 0;
        const scoreCls = (r.avg_quality_score >= 85) ? 'badge badge-a' : (r.avg_quality_score >= 70) ? 'badge badge-b' : (r.avg_quality_score >= 55) ? 'badge badge-c' : 'badge badge-d';
        return `<tr>
          <td><strong>${Admin.escapeHtml(r.source_name || r.source_id)}</strong></td>
          <td style="font-size:11px;color:var(--text-secondary);">${Admin.escapeHtml(r.source_type || '—')}</td>
          <td>${(r.records || 0).toLocaleString()}</td>
          <td><span class="${scoreCls}">${r.avg_quality_score}</span></td>
          <td><span class="badge badge-a">${r.level_a || 0}</span></td>
          <td><span class="badge badge-b">${r.level_b || 0}</span></td>
          <td><span class="badge badge-c">${r.level_c || 0}</span></td>
          <td><span class="badge badge-d">${r.level_d || 0}</span></td>
          <td>
            <div style="display:flex;height:14px;border-radius:3px;overflow:hidden;gap:1px;width:160px;">
              <div style="width:${pctA}%;background:var(--green);" title="A: ${pctA.toFixed(1)}%"></div>
              <div style="width:${pctB}%;background:var(--teal);" title="B: ${pctB.toFixed(1)}%"></div>
              <div style="width:${pctC}%;background:var(--yellow);" title="C: ${pctC.toFixed(1)}%"></div>
              <div style="width:${pctD}%;background:var(--red);" title="D: ${pctD.toFixed(1)}%"></div>
            </div>
          </td>
        </tr>`;
      }).join('');
    }
  } catch(e) {
    document.getElementById('dq-source-body').innerHTML = `<tr><td colspan="9" class="empty-state"><p>加载失败: ${Admin.escapeHtml(e.message)}</p></td></tr>`;
  }

  // --- Rules --------------------------------------------------------------
  try {
    const rules = await API.get('/data-quality/rules');
    const el = document.getElementById('dq-rules');
    let html = `<p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">基础分: <strong style="color:var(--text-primary);">${rules.base_score}</strong>，扣分项:</p>`;
    html += '<table><thead><tr><th>扣分项</th><th>分值</th></tr></thead><tbody>';
    const labels = {
      missing_title: '缺少标题', missing_source_url: '缺少来源URL', missing_collected_at: '缺少采集时间',
      missing_published_at: '缺少发布时间', missing_city: '缺少城市', missing_company: '缺少公司',
      missing_origin_record_id: '缺少原始ID', short_responsibility: '职责描述过短', short_requirement: '要求描述过短',
      no_skill_hit: '无技能命中', duplicate_content: '重复内容', unknown_source: '未知数据源',
    };
    for (const [k, v] of Object.entries(rules.penalties || {})) {
      html += `<tr><td>${labels[k] || k}</td><td style="color:var(--red);">-${v}</td></tr>`;
    }
    html += '</tbody></table>';
    html += '<p style="font-size:11px;color:var(--text-muted);margin-top:12px;">等级: ';
    for (const [lvl, range] of Object.entries(rules.levels || {})) {
      html += `<span class="badge badge-${lvl.toLowerCase()}" style="margin-right:6px;">${lvl}: ${range}</span>`;
    }
    html += '</p>';
    el.innerHTML = html;
  } catch(e) {
    document.getElementById('dq-rules').innerHTML = `<p style="color:var(--text-muted);">加载失败: ${Admin.escapeHtml(e.message)}</p>`;
  }

  // --- Field coverage -----------------------------------------------------
  try {
    const fc = await API.get('/data-quality/field-coverage');
    const el = document.getElementById('dq-coverage');
    let html = '';
    if (fc && typeof fc === 'object') {
      for (const [field, info] of Object.entries(fc)) {
        const pct = info.total ? (info.non_null / info.total * 100).toFixed(1) : 0;
        html += `<div class="bar-row">
          <div class="bar-label">${field}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
          <div class="bar-value">${pct}%</div>
        </div>`;
        html += `<p style="font-size:10px;color:var(--text-muted);margin:0 0 8px 130px;">${info.non_null?.toLocaleString() || 0} / ${info.total?.toLocaleString() || 0} &middot; ${Admin.escapeHtml(info.method || '')}</p>`;
      }
    }
    el.innerHTML = html || '<p style="color:var(--text-muted);">暂无覆盖率数据</p>';
  } catch(e) {
    document.getElementById('dq-coverage').innerHTML = `<p style="color:var(--text-muted);">加载失败</p>`;
  }
})();
</script>
{% endblock %}
